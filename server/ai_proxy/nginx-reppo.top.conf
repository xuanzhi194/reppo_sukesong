# Nginx 站点配置示例：/etc/nginx/conf.d/reppo.top.conf
# 证书由 certbot 自动写入 ssl_certificate 路径

server {
    listen 80;
    server_name reppo.top www.reppo.top;
    # certbot --nginx 会自动添加 443 与证书；首次可先保留本 server 用于验证

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name reppo.top www.reppo.top;

    # certbot 部署后类似：
    # ssl_certificate     /etc/letsencrypt/live/reppo.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/reppo.top/privkey.pem;

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/ai/summary {
        proxy_pass http://127.0.0.1:8080/v1/ai/summary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
