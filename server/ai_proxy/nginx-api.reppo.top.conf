# /etc/nginx/conf.d/api.reppo.top.conf
# AI 代理专用子域名（与官网 reppo.top 分离）
# 首次部署：仅 HTTP；DNS A 记录 api → ECS IP 且 80 可达后：
#   certbot --nginx -d api.reppo.top

server {
    listen 80;
    server_name api.reppo.top;

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /v1/asr/transcribe {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8080/v1/asr/transcribe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 45s;
        proxy_connect_timeout 10s;
    }

    location /v1/ai/summary {
        proxy_pass http://127.0.0.1:8080/v1/ai/summary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
